[project]
name = "dsgvo-copilot-backend"
version = "0.1.0"
description = "Production-grade compliance backend for German SMEs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "langgraph>=0.2.14",
  "langchain>=0.2.14",
  "langchain-openai>=0.1.22",
  "qdrant-client>=1.10.1",
  "rank-bm25>=0.2.2",
  "networkx>=3.3",
  "redis>=5.0.7",
  "celery>=5.4.0",
  "httpx>=0.27.0",
  "orjson>=3.10.6",
  "pypdf>=4.2.0",
  "python-docx>=1.1.2",
  "sqlalchemy>=2.0.32",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.0.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
