name: Build and Deploy

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_REF_NAME:-sha-${GITHUB_SHA::7}}" >> $GITHUB_OUTPUT

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dsgvo-copilot-backend:${{ steps.vars.outputs.tag }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dsgvo-copilot-worker:${{ steps.vars.outputs.tag }}

      - name: Build and push ml-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend-ml.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dsgvo-copilot-ml-worker:${{ steps.vars.outputs.tag }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dsgvo-copilot-frontend:${{ steps.vars.outputs.tag }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            export IMAGE_TAG=${GITHUB_REF_NAME:-sha-${GITHUB_SHA::7}}
            cd /opt/dsgvo-copilot
            docker compose -f infra/docker-compose.prod.yml pull
            docker compose -f infra/docker-compose.prod.yml up -d
